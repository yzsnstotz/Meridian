name: Feature request
description: Propose an operator, orchestration, or integration improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What operator or integration problem exists today?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior rather than only an implementation idea.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Likely surface
      options:
        - Runtime
        - Orchestrator
        - Supervisor
        - CLI
        - Gateway
        - Contracts / integration
        - Documentation
        - Cross-package / unsure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note current workarounds or other designs you evaluated.

  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Add sanitized examples, diagrams, screenshots, or links that clarify the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and pull requests for related work.
          required: true
        - label: This request does not contain credentials or private data.
          required: true
