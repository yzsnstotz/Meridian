name: Bug report
description: Report a reproducible Meridian defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Meridian. Remove tokens, credentials, personal paths, and private log content before submitting.

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Runtime
        - Orchestrator
        - Supervisor
        - CLI
        - Gateway
        - Telegram
        - Documentation
        - Unsure
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Meridian revision
      description: Commit SHA, tag, or branch name.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, and relevant provider CLI/version.
      placeholder: macOS 15, Node.js 22.13.0, Codex ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant `meridian doctor`, test, or log output after removing secrets and personal data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: I removed credentials, tokens, and private data from this report.
          required: true
