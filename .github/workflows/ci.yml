name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test workspace
        run: npm test

      - name: Test orchestrator
        # The suite contains process- and port-oriented fixtures. Serializing
        # test files avoids worker RPC starvation on shared CI runners.
        #
        # Guarded because this step was written against the packages/* workspace
        # layout, which currently exists only on feat/meridian-monorepo-portability
        # (#139). On main there is no `workspaces` key and no @meridian/orchestrator,
        # so the command fails outright with "No workspaces found". That went
        # unnoticed because the step is last and the preceding suite failed first,
        # hiding it behind an unrelated red X on every PR.
        #
        # The guard keeps one workflow file correct in both layouts: it is skipped
        # until the workspace exists and runs automatically once #139 lands, so
        # neither branch has to carry a divergent copy of ci.yml.
        if: hashFiles('packages/orchestrator/package.json') != ''
        run: npm run test -w @meridian/orchestrator -- --no-file-parallelism
