name: meridian

x-meridian-common: &meridian-common
  build:
    context: .
    target: runtime
  image: meridian-runtime:local
  env_file:
    - .env
  environment:
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    MERIDIAN_STATE_DIR: /var/lib/meridian
    MERIDIAN_RUNTIME_DIR: /run/meridian
    LOG_DIR: /var/lib/meridian/logs
    HUB_SOCKET_PATH: /run/meridian/sockets/hub-core.sock
  volumes:
    - meridian-state:/var/lib/meridian
    - meridian-runtime:/run/meridian
  restart: unless-stopped

services:
  hub:
    <<: *meridian-common
    container_name: meridian-hub
    command: ["node", "dist/hub/index.js"]

  interface:
    <<: *meridian-common
    container_name: meridian-interface
    command: ["node", "dist/interface/index.js"]
    depends_on:
      - hub

  monitor:
    <<: *meridian-common
    container_name: meridian-monitor
    command: ["node", "dist/monitor/index.js"]
    depends_on:
      - hub
    profiles:
      - monitor

volumes:
  meridian-state:
  meridian-runtime:
