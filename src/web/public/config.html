<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Config Editor</title>
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/app.js"></script>
  </head>
  <body data-page="config-editor">
    <main class="shell">
      <section class="hero hero-compact">
        <a id="config-detail-link" class="back-link" href="/">← Task Detail</a>
        <p class="eyebrow">Config Editor</p>
        <h1 id="config-title">Loading config…</h1>
        <p id="config-lede" class="lede">Edit dispatcher JSON for `tasks` and `taskspec`. Prompt content stays on the prompt editor.</p>
      </section>

      <section class="panel panel-form">
        <div class="panel-heading">
          <h2 id="config-section-title">Dispatch Plan JSON</h2>
          <p id="config-status" class="muted">Only tasks and taskspec are editable here. Runtime task fields are reset on save.</p>
        </div>
        <form id="config-form" class="stack">
          <!-- Structured fields for agent-dispatcher config -->
          <div id="config-fields" hidden>
            <label class="field">
              <span>dispatch_plan_path</span>
              <input id="cfg-dispatch-plan-path" type="text" readonly />
            </label>
            <label class="field">
              <span>command_file_path</span>
              <input id="cfg-command-file-path" type="text" readonly />
            </label>
            <label class="field">
              <span>dispatch_repo_root</span>
              <input id="cfg-dispatch-repo-root" type="text" readonly />
            </label>
            <label class="field">
              <span>docs_root</span>
              <input id="cfg-docs-root" type="text" readonly />
            </label>
            <label class="field">
              <span>agent_type</span>
              <select id="cfg-agent-type">
                <option value="claude">claude</option>
                <option value="codex">codex</option>
                <option value="gemini">gemini</option>
                <option value="cursor">cursor</option>
              </select>
            </label>
            <label class="field">
              <span>model_id</span>
              <input id="cfg-model-id" type="text" placeholder="(default)" />
            </label>
            <label class="field">
              <span>mode</span>
              <select id="cfg-mode">
                <option value="bridge">bridge</option>
                <option value="pane_bridge">pane_bridge</option>
              </select>
            </label>
            <label class="field">
              <span>kill_policy</span>
              <select id="cfg-kill-policy">
                <option value="always">always</option>
                <option value="on_success">on_success</option>
                <option value="never">never</option>
              </select>
            </label>
            <label class="field">
              <span>auto_approve</span>
              <select id="cfg-auto-approve">
                <option value="false">false</option>
                <option value="true">true</option>
              </select>
            </label>
            <label class="field">
              <span>user_reply_channels</span>
              <textarea id="cfg-reply-channels" class="editor-textarea" rows="4" readonly style="min-height: 80px"></textarea>
            </label>
          </div>
          <!-- Fallback raw JSON textarea for non-agent-dispatcher configs -->
          <label class="field" id="config-raw-field">
            <span>dispatcher_config</span>
            <textarea id="config-input" class="editor-textarea" rows="18" spellcheck="false"></textarea>
          </label>
          <div class="actions">
            <button id="config-save-button" type="submit" class="primary-button">Save Config</button>
            <p id="config-feedback" class="feedback" role="status" aria-live="polite"></p>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
