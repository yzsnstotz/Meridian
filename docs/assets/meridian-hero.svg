<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Meridian</title>
  <desc id="desc">A local-first multi-agent orchestration platform</desc>
  <defs>
    <linearGradient id="bg" x1="46" y1="22" x2="1130" y2="346" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#0B1730"/>
      <stop offset="1" stop-color="#11172B"/>
    </linearGradient>
    <linearGradient id="orbit" x1="89" y1="90" x2="348" y2="289" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.52" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="word" x1="425" y1="113" x2="1011" y2="253" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CFE1F5"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(218 180) rotate(90) scale(72)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#B7C9E2" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <rect width="1200" height="360" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="1100" cy="-8" r="280" fill="#4F46E5" fill-opacity="0.065"/>
    <circle cx="42" cy="395" r="250" fill="#14B8A6" fill-opacity="0.055"/>

    <g transform="translate(40 0)">
      <circle cx="178" cy="180" r="86" fill="url(#core)"/>
      <ellipse cx="178" cy="180" rx="126" ry="56" transform="rotate(-24 178 180)" stroke="url(#orbit)" stroke-width="2.5" stroke-opacity="0.82"/>
      <ellipse cx="178" cy="180" rx="126" ry="56" transform="rotate(36 178 180)" stroke="url(#orbit)" stroke-width="1.4" stroke-opacity="0.34"/>
      <path d="M115 125L178 180L248 121M178 180L248 240M178 180L103 235" stroke="#BCEDE7" stroke-opacity="0.34" stroke-width="1.5"/>
      <circle cx="178" cy="180" r="26" fill="#0B1730" stroke="#5EEAD4" stroke-width="2.5"/>
      <path d="M166 180L175 189L192 171" stroke="#E7FFFB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="115" cy="125" r="7" fill="#5EEAD4" filter="url(#glow)"/>
      <circle cx="248" cy="121" r="7" fill="#60A5FA" filter="url(#glow)"/>
      <circle cx="248" cy="240" r="7" fill="#A78BFA" filter="url(#glow)"/>
      <circle cx="103" cy="235" r="5" fill="#7DD3FC"/>
    </g>

    <g transform="translate(390 0)">
      <text x="0" y="168" fill="url(#word)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="78" font-weight="720" letter-spacing="9">MERIDIAN</text>
      <text x="4" y="211" fill="#8FA8C7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="500" letter-spacing="1.1">MULTI-AGENT ORCHESTRATION, UNDER CONTROL</text>
      <g transform="translate(4 244)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">
        <rect width="92" height="30" rx="15" fill="#5EEAD4" fill-opacity="0.1" stroke="#5EEAD4" stroke-opacity="0.28"/>
        <text x="18" y="20" fill="#9EF3E7">RUNTIME</text>
        <rect x="104" width="132" height="30" rx="15" fill="#60A5FA" fill-opacity="0.1" stroke="#60A5FA" stroke-opacity="0.28"/>
        <text x="121" y="20" fill="#A9D0FF">ORCHESTRATOR</text>
        <rect x="248" width="112" height="30" rx="15" fill="#A78BFA" fill-opacity="0.1" stroke="#A78BFA" stroke-opacity="0.28"/>
        <text x="266" y="20" fill="#D0BCFF">SUPERVISOR</text>
        <rect x="372" width="92" height="30" rx="15" fill="#7DD3FC" fill-opacity="0.1" stroke="#7DD3FC" stroke-opacity="0.28"/>
        <text x="389" y="20" fill="#BCE8FC">GATEWAY</text>
      </g>
    </g>

    <path d="M0 337C214 306 324 371 514 337C725 299 927 350 1200 312" stroke="url(#orbit)" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>
</svg>
